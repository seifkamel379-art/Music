name: Build seifoo APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  MIN_SDK: 23
  TARGET_SDK: 35
  COMPILE_SDK: 35

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      # ──────────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────
      # 2. Toolchain
      # ──────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: $(pnpm store path --silent)
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # ──────────────────────────────────────────────────
      # 3. Install & Build web
      # ──────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: artifacts/web
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
          VITE_WORKER_AUTH_KEY: ${{ secrets.VITE_WORKER_AUTH_KEY }}
          BASE_PATH: /
        run: pnpm run build

      # ──────────────────────────────────────────────────
      # 4. Capacitor – add android platform
      # ──────────────────────────────────────────────────
      - name: Add Android platform
        working-directory: artifacts/web
        run: |
          npx cap add android 2>&1 | tee /tmp/cap-add.log
          echo "=== cap add exit: $?" >> /tmp/cap-add.log

      # ──────────────────────────────────────────────────
      # 5. Patch AndroidManifest.xml
      # ──────────────────────────────────────────────────
      - name: Patch AndroidManifest
        working-directory: artifacts/web
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "--- Original manifest ---" | tee /tmp/manifest-patch.log
          cat "$MANIFEST" >> /tmp/manifest-patch.log

          # Remove any existing duplicate permission lines first
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/d' "$MANIFEST"

          # Insert all required permissions after <manifest ...>
          PERMS='    <uses-permission android:name="android.permission.INTERNET" />\n'
          PERMS+='    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
          PERMS+='    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n'
          PERMS+='    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n'
          PERMS+='    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
          PERMS+='    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n'
          PERMS+='    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          PERMS+='    <uses-permission android:name="android.permission.DOWNLOAD_WITHOUT_NOTIFICATION" />'
          # Insert after first line containing <manifest
          sed -i "/<manifest /a\\${PERMS}" "$MANIFEST"

          # Enable cleartext traffic for Google CDN audio URLs
          if grep -q 'android:usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/' "$MANIFEST"
          else
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

          echo "--- Patched manifest ---" >> /tmp/manifest-patch.log
          cat "$MANIFEST" >> /tmp/manifest-patch.log
          echo "Manifest patch done"

      # ──────────────────────────────────────────────────
      # 6. Patch build.gradle – SDK versions + ProGuard off
      # ──────────────────────────────────────────────────
      - name: Patch build.gradle SDK versions
        working-directory: artifacts/web/android
        run: |
          GRADLE="app/build.gradle"
          echo "--- Original build.gradle ---" | tee /tmp/gradle-patch.log
          cat "$GRADLE" >> /tmp/gradle-patch.log

          # Force minSdk to 21 (Android 5.0) — widest possible support
          # Use .* to match full value (handles both numeric literals and rootProject.ext.* variable references)
          sed -i "s/minSdkVersion .*/minSdkVersion ${{ env.MIN_SDK }}/g" "$GRADLE"
          sed -i "s/minSdk .*/minSdk ${{ env.MIN_SDK }}/g" "$GRADLE"
          sed -i "s/targetSdkVersion .*/targetSdkVersion ${{ env.TARGET_SDK }}/g" "$GRADLE"
          sed -i "s/targetSdk .*/targetSdk ${{ env.TARGET_SDK }}/g" "$GRADLE"
          sed -i "s/compileSdkVersion .*/compileSdkVersion ${{ env.COMPILE_SDK }}/g" "$GRADLE"
          sed -i "s/compileSdk .*/compileSdk ${{ env.COMPILE_SDK }}/g" "$GRADLE"

          # Disable minify/shrink for debug build (keeps all code, simpler logs)
          sed -i "s/minifyEnabled true/minifyEnabled false/g" "$GRADLE"
          sed -i "s/shrinkResources true/shrinkResources false/g" "$GRADLE"

          echo "--- Patched build.gradle ---" >> /tmp/gradle-patch.log
          cat "$GRADLE" >> /tmp/gradle-patch.log
          echo "build.gradle patched"

      # ──────────────────────────────────────────────────
      # 7. Copy & register MediaScan plugin
      # ──────────────────────────────────────────────────
      - name: Install MediaScan plugin
        working-directory: artifacts/web
        run: |
          # Detect the app package directory by finding MainActivity.java directly
          MAIN_FILE=$(find android/app/src/main/java -name "MainActivity.java" | head -1)
          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.java not found under android/app/src/main/java" | tee /tmp/plugin-install.log
            find android/app/src/main/java -type f | tee -a /tmp/plugin-install.log
            exit 1
          fi
          PKG_DIR=$(dirname "$MAIN_FILE")
          echo "Package dir: $PKG_DIR" | tee /tmp/plugin-install.log
          echo "MainActivity: $MAIN_FILE" >> /tmp/plugin-install.log

          cp ../../.github/android-patches/MediaScanPlugin.java "$PKG_DIR/MediaScanPlugin.java"
          echo "Copied MediaScanPlugin.java to $PKG_DIR" >> /tmp/plugin-install.log

          # Fix package name to match actual package
          PACKAGE=$(grep "^package " "$MAIN_FILE" | head -1 | sed 's/package //;s/;//')
          if [ -n "$PACKAGE" ]; then
            sed -i "s/^package io.seifoo.app;/package $PACKAGE;/" "$PKG_DIR/MediaScanPlugin.java"
            # NOTE: Do NOT rename the local ContentUris helper class — it shadows android.content.ContentUris
            # intentionally within the file, and renaming breaks the reference on line 189.
            echo "Set package: $PACKAGE" >> /tmp/plugin-install.log
          fi

          # Patch MainActivity to register the plugin
          MAIN="$MAIN_FILE"
          echo "--- Original MainActivity ---" >> /tmp/plugin-install.log
          cat "$MAIN" >> /tmp/plugin-install.log

          if grep -q "registerPlugin\|MediaScanPlugin" "$MAIN"; then
            echo "Plugin already registered" >> /tmp/plugin-install.log
          else
            # Add import only if not already present
            if ! grep -q "import com.getcapacitor.BridgeActivity;" "$MAIN"; then
              sed -i "/^package /a import com.getcapacitor.BridgeActivity;" "$MAIN" 2>/dev/null || true
            fi
            # Add registerPlugin before super.onCreate or as a new override
            if grep -q "onCreate" "$MAIN"; then
              # Insert registerPlugin call at the beginning of onCreate
              sed -i '/onCreate.*Bundle/{ n; s/^/        registerPlugin(MediaScanPlugin.class);\n/ }' "$MAIN"
            else
              # No onCreate — add full override
              sed -i 's/public class \([A-Za-z]*\) extends BridgeActivity {/public class \1 extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(MediaScanPlugin.class);\n        super.onCreate(savedInstanceState);\n    }/' "$MAIN"
            fi
          fi

          echo "--- Patched MainActivity ---" >> /tmp/plugin-install.log
          cat "$MAIN" >> /tmp/plugin-install.log

      # ──────────────────────────────────────────────────
      # 7b. Install AudioForegroundService + AudioServicePlugin
      #     (Foreground Service + MediaSession + NotificationCompat.MediaStyle)
      # ──────────────────────────────────────────────────
      - name: Install Audio Foreground Service
        working-directory: artifacts/web
        run: |
          chmod +x ../../.github/android-patches/patch-audio-service.sh
          bash ../../.github/android-patches/patch-audio-service.sh \
               "$(pwd)" \
               "$(pwd)/../../.github/android-patches" \
               2>&1 | tee /tmp/audio-service-patch.log

      # ──────────────────────────────────────────────────
      # 8. Capacitor sync
      # ──────────────────────────────────────────────────
      - name: Sync Capacitor
        working-directory: artifacts/web
        run: npx cap sync android 2>&1 | tee /tmp/cap-sync.log

      # ──────────────────────────────────────────────────
      # 9. Build APK
      # ──────────────────────────────────────────────────
      - name: Make Gradle executable
        working-directory: artifacts/web/android
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('artifacts/web/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Debug APK (with full logs)
        working-directory: artifacts/web/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee /tmp/gradle-full-build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "=== Gradle exit: $GRADLE_EXIT" >> /tmp/gradle-full-build.log
          exit $GRADLE_EXIT

      # ──────────────────────────────────────────────────
      # 10. Collect ALL logs (mandatory — always runs)
      # ──────────────────────────────────────────────────
      - name: Collect all build logs
        if: always()
        run: |
          mkdir -p /tmp/seifoo-build-logs

          # Copy all intermediate logs
          for f in /tmp/cap-add.log /tmp/cap-sync.log /tmp/manifest-patch.log \
                   /tmp/gradle-patch.log /tmp/plugin-install.log \
                   /tmp/audio-service-patch.log \
                   /tmp/gradle-full-build.log; do
            [ -f "$f" ] && cp "$f" /tmp/seifoo-build-logs/
          done

          # Gradle build scan reports
          find ~/.gradle -name "*.log" -newer /tmp 2>/dev/null | head -20 | \
            xargs -I{} cp {} /tmp/seifoo-build-logs/ 2>/dev/null || true

          # APK info
          APK=$(find artifacts/web/android -name "app-debug.apk" 2>/dev/null | head -1)
          {
            echo "=============================="
            echo " seifoo APK Build Summary"
            echo "=============================="
            echo "Date       : $(date -u)"
            echo "Commit     : $GITHUB_SHA"
            echo "Branch     : $GITHUB_REF_NAME"
            echo "Runner OS  : ${{ runner.os }}"
            echo "Java       : $(java -version 2>&1 | head -1)"
            echo "Node       : $(node --version)"
            echo "pnpm       : $(pnpm --version)"
            echo ""
            if [ -n "$APK" ] && [ -f "$APK" ]; then
              echo "STATUS     : ✅ BUILD SUCCESS"
              echo "APK path   : $APK"
              echo "APK size   : $(du -sh "$APK" | cut -f1)"
              echo ""
              # List APK contents summary
              echo "APK contents (top-level):"
              unzip -l "$APK" 2>/dev/null | head -40 || true
            else
              echo "STATUS     : ❌ BUILD FAILED (no APK found)"
              echo ""
              echo "--- Last 100 lines of Gradle log ---"
              tail -100 /tmp/gradle-full-build.log 2>/dev/null || echo "(no gradle log)"
            fi
          } | tee /tmp/seifoo-build-logs/SUMMARY.txt

          # Errors — catch Java errors, AAPT2 errors, D8/R8 failures, and Gradle failures
          {
            grep -n "error:" /tmp/gradle-full-build.log 2>/dev/null | head -50
            grep -n "ERROR:" /tmp/gradle-full-build.log 2>/dev/null | head -50
            grep -n "FAILURE:" /tmp/gradle-full-build.log 2>/dev/null | head -20
            grep -n "Execution failed for task" /tmp/gradle-full-build.log 2>/dev/null | head -20
            grep -n "What went wrong" /tmp/gradle-full-build.log 2>/dev/null | head -10
          } | sort -t: -k1,1n | uniq > /tmp/seifoo-build-logs/COMPILE_ERRORS.txt || true

          # Warnings
          grep -n "warning:" /tmp/gradle-full-build.log 2>/dev/null | \
            head -100 > /tmp/seifoo-build-logs/COMPILE_WARNINGS.txt || true

          echo "Logs collected: $(ls /tmp/seifoo-build-logs/ | wc -l) files"
          cat /tmp/seifoo-build-logs/SUMMARY.txt

      # ──────────────────────────────────────────────────
      # 11. Upload artifacts (ALWAYS — mandatory)
      # ──────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seifoo-debug-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 60

      - name: Upload full build logs (mandatory)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ github.run_number }}
          path: /tmp/seifoo-build-logs/
          if-no-files-found: ignore
          retention-days: 60

      - name: Upload Gradle reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-reports-${{ github.run_number }}
          path: |
            artifacts/web/android/app/build/reports/
            artifacts/web/android/build/reports/
          if-no-files-found: ignore
          retention-days: 30

      # ──────────────────────────────────────────────────
      # 12. Job summary
      # ──────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          APK=$(find artifacts/web/android -name "app-debug.apk" 2>/dev/null | head -1)
          echo "## 📱 seifoo APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`$GITHUB_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`$GITHUB_REF_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$APK" ] && [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "| Status | ✅ SUCCESS |" >> $GITHUB_STEP_SUMMARY
            echo "| APK Size | $SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⬇️ Download from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check **build-logs** artifact for details." >> $GITHUB_STEP_SUMMARY
          fi
