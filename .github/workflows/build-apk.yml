name: Build Android APK (Expo)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Android APK – Expo React Native
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Toolchain ───────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Accept Android SDK licenses ────────────────────────
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # ── 4. Install workspace dependencies ─────────────────────
      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 5. Expo Prebuild (generates android/ from app.json) ───
      - name: Expo Prebuild – Android
        working-directory: artifacts/mobile
        env:
          CI: "1"
          EXPO_NO_INSTALL: "1"
          EXPO_NO_GIT_STATUS: "1"
          EXPO_PUBLIC_DOMAIN: youtube-stream-api--seifmusic7.replit.app
        run: |
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee /tmp/prebuild.log
          echo "=== Prebuild exit: $?" >> /tmp/prebuild.log

      # ── 6. Gradle cache ────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('artifacts/mobile/android/**/*.gradle*', 'artifacts/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 7. Make gradlew executable ─────────────────────────────
      - name: chmod gradlew
        working-directory: artifacts/mobile/android
        run: chmod +x gradlew

      # ── 8. Keystore: load from secrets or generate ephemeral ──
      - name: Prepare keystore
        working-directory: artifacts/mobile/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_VAL: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS_VAL: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > seifmusic.keystore
            echo "KS_PASS=$ANDROID_KEYSTORE_PASS"       >> $GITHUB_ENV
            echo "KS_ALIAS=$ANDROID_KEY_ALIAS_VAL"      >> $GITHUB_ENV
            echo "KS_KEY_PASS=$ANDROID_KEY_PASS_VAL"    >> $GITHUB_ENV
            echo "Using stored keystore from secrets"
          else
            keytool -genkeypair -v \
              -keystore seifmusic.keystore \
              -alias seifmusic \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Seif Music,OU=Dev,O=SeifMusic,L=Cairo,ST=Cairo,C=EG" \
              -storepass seifmusic2025 -keypass seifmusic2025 \
              -noprompt
            echo "KS_PASS=seifmusic2025"      >> $GITHUB_ENV
            echo "KS_ALIAS=seifmusic"          >> $GITHUB_ENV
            echo "KS_KEY_PASS=seifmusic2025"  >> $GITHUB_ENV
            echo "Generated ephemeral keystore (no secrets configured)"
          fi
          echo "KS_PATH=$(pwd)/seifmusic.keystore" >> $GITHUB_ENV

      # ── 9. Build signed release APK ────────────────────────────
      - name: Build APK (assembleRelease)
        working-directory: artifacts/mobile/android
        env:
          EXPO_PUBLIC_DOMAIN: youtube-stream-api--seifmusic7.replit.app
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${{ env.KS_PATH }}" \
            -Pandroid.injected.signing.store.password="${{ env.KS_PASS }}" \
            -Pandroid.injected.signing.key.alias="${{ env.KS_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ env.KS_KEY_PASS }}" \
            --no-daemon \
            --stacktrace \
            2>&1 | tee /tmp/gradle-build.log
          EXIT=${PIPESTATUS[0]}
          echo "=== Gradle exit: $EXIT" >> /tmp/gradle-build.log
          exit $EXIT

      # ── 10. Rename APK ─────────────────────────────────────────
      - name: Rename APK
        if: success()
        run: |
          mkdir -p output
          cp artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk \
             output/seif-music-v${{ github.run_number }}.apk
          echo "APK size: $(du -sh output/seif-music-v${{ github.run_number }}.apk | cut -f1)"

      # ── 11. Collect logs (always) ──────────────────────────────
      - name: Collect build logs
        if: always()
        run: |
          mkdir -p /tmp/build-logs
          for f in /tmp/prebuild.log /tmp/gradle-build.log; do
            [ -f "$f" ] && cp "$f" /tmp/build-logs/
          done
          APK=$(find artifacts/mobile/android -name "app-release.apk" 2>/dev/null | head -1)
          {
            echo "===================================="
            echo "  Seif Music APK Build Summary"
            echo "===================================="
            echo "Date   : $(date -u)"
            echo "Commit : $GITHUB_SHA"
            echo "Branch : $GITHUB_REF_NAME"
            echo "Run    : #${{ github.run_number }}"
            if [ -n "$APK" ] && [ -f "$APK" ]; then
              echo "Status : SUCCESS"
              echo "APK    : $APK ($(du -sh "$APK" | cut -f1))"
            else
              echo "Status : FAILED – no APK produced"
              echo ""
              echo "Last 80 lines of Gradle log:"
              tail -80 /tmp/gradle-build.log 2>/dev/null || true
            fi
          } | tee /tmp/build-logs/SUMMARY.txt
          grep -n "error:\|FAILURE:\|Execution failed" /tmp/gradle-build.log 2>/dev/null \
            | head -60 > /tmp/build-logs/ERRORS.txt || true

      # ── 12. Upload APK artifact ────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: seif-music-apk-v${{ github.run_number }}
          path: output/seif-music-v${{ github.run_number }}.apk
          retention-days: 90

      # ── 13. Upload build logs (always) ────────────────────────
      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ github.run_number }}
          path: /tmp/build-logs/
          if-no-files-found: ignore
          retention-days: 30

      # ── 14. Job summary ────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          APK=$(find artifacts/mobile/android -name "app-release.apk" 2>/dev/null | head -1)
          echo "## 📱 Seif Music APK Build" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${GITHUB_SHA:0:8}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`$GITHUB_REF_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$APK" ] && [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "| Status | ✅ SUCCESS |" >> $GITHUB_STEP_SUMMARY
            echo "| APK Size | $SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⬇️ Download from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the **build-logs** artifact for details." >> $GITHUB_STEP_SUMMARY
          fi
